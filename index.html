<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BTP Insights Platform Portal</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root { color-scheme: light; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .tracking-tightish { letter-spacing: 0.01em; }
  .nav-item {
    position: relative;
    padding-left: 1rem;
  }
  .nav-item.active { color: #ffffff; font-weight: 700; }
  .nav-item.active::before {
    content: "";
    position: absolute;
    left: 0; top: 2px; bottom: 2px;
    width: 2px;
    background: #ffffff;
  }
  .nav-item:not(.active) { color: #8a8a8a; }
  .nav-item:not(.active):hover { color: #d4d4d4; }
  .seg-btn { transition: background-color .15s ease, color .15s ease; }

  /* seamless iframe */
  .report-frame {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    background: #faf9f5;
  }
  .frame-shell {
    background: #faf9f5;
  }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #d8d6cf; border-radius: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }

  #sidebar { transition: transform .25s ease-in-out; }
  #sidebar-overlay { transition: opacity .2s ease-in-out; }
</style>
</head>
<body class="bg-[#eeece6] text-black">

<div class="flex h-screen w-screen overflow-hidden relative">

  <!-- overlay for mobile off-canvas sidebar -->
  <div id="sidebar-overlay" onclick="closeSidebar()" class="hidden fixed inset-0 bg-black/50 z-30 md:hidden"></div>

  <!-- ============ SIDEBAR ============ -->
  <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-40 -translate-x-full md:translate-x-0 w-[260px] shrink-0 bg-black text-white flex flex-col h-full">
    <div class="px-6 pt-8 pb-6">
      <div class="flex items-center justify-between mb-8">
        <div class="flex items-center text-white">

        </div>
        <button onclick="closeSidebar()" aria-label="Close menu" class="md:hidden text-white/70 hover:text-white p-1 -mr-1">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <h1 class="text-[15px] font-extrabold uppercase tracking-tight leading-snug">
        Insights Platform Portal
      </h1>
    </div>

    <!-- Reports / Measures toggle -->
    <div class="px-6 mb-7">
      <div class="grid grid-cols-2 rounded-md overflow-hidden border border-white/15 text-[12px] font-bold uppercase tracking-wide">
        <button id="tab-reports" onclick="setSection('reports')" class="seg-btn py-2 uppercase"></button>
        <button id="tab-measures" onclick="setSection('measures')" class="seg-btn py-2 uppercase"></button>
      </div>
    </div>

    <!-- Categories -->
    <div id="categories-block" class="px-6">
      <div class="text-[10px] font-bold uppercase tracking-widest text-[#6b6b6b] mb-3">Categories</div>
      <nav class="flex flex-col gap-4 text-[13px] font-bold uppercase tracking-wide">
        <a href="#" onclick="setCategory('general');return false;" data-cat="general" class="nav-item">General</a>
        <a href="#" onclick="setCategory('social');return false;" data-cat="social" class="nav-item">Social</a>
        <a href="#" onclick="setCategory('campaign');return false;" data-cat="campaign" class="nav-item">Campaign</a>
        <a href="#" onclick="setCategory('product');return false;" data-cat="product" class="nav-item">Product</a>
      </nav>
    </div>

    <div class="flex-1"></div>
  </aside>

  <!-- ============ MAIN ============ -->
  <main class="flex-1 h-full flex flex-col overflow-hidden min-w-0">

    <!-- mobile top bar with hamburger -->
    <div class="md:hidden shrink-0 flex items-center gap-3 px-4 py-3 bg-black text-white">
      <button onclick="openSidebar()" aria-label="Open menu" class="p-1 -ml-1">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="flex flex-col justify-center gap-1 leading-none">
        <svg xmlns="http://www.w3.org/2000/svg" width="96" viewBox="0 0 161 40" fill="none" role="img" aria-label="Be The People"><g fill="currentColor" clip-path="url(#b)"><path d="M59.481 15.434h10.14v3.29h-3.12v13.4h-3.897v-13.4h-3.121v-3.29h-.002ZM80.959 32.125h-3.92v-6.983h-2.441v6.983h-3.92V15.434h3.92v6.723h2.44v-6.723h3.92v16.69ZM90.912 29.187v2.94h-8.31V15.434h8.145v2.94h-4.225v3.69h3.92v2.94h-3.92v4.184h4.39v-.002ZM96.263 32.125V15.434h5.094c3.333 0 5.047 1.504 5.071 4.419v1.363c0 3.126-1.737 4.82-4.976 4.82h-1.267v6.089H96.263Zm4.671-8.792c1.01 0 1.431-.611 1.431-2.187v-1.199c0-1.34-.421-1.881-1.431-1.881h-.751v5.265h.751v.002ZM115.91 29.187v2.94h-8.31V15.434h8.145v2.94h-4.225v3.69h3.92v2.94h-3.92v4.184h4.39v-.002ZM116.849 27.024v-6.488c0-3.526 2.066-5.502 5.446-5.502s5.445 1.974 5.445 5.502v6.488c0 3.526-2.065 5.5-5.445 5.5-3.38 0-5.446-1.974-5.446-5.5Zm5.446 2.491c.891 0 1.409-.681 1.409-1.974v-7.523c0-1.293-.516-1.975-1.409-1.975s-1.409.682-1.409 1.975v7.523c0 1.293.516 1.974 1.409 1.974ZM129.502 32.125V15.434h5.094c3.333 0 5.047 1.504 5.071 4.419v1.363c0 3.126-1.737 4.82-4.976 4.82h-1.267v6.089H129.502Zm4.671-8.792c1.01 0 1.431-.611 1.431-2.187v-1.199c0-1.34-.421-1.881-1.431-1.881h-.751v5.265h.751v.002ZM140.841 15.434h3.92v13.305h4.014v3.386h-7.933V15.434h-.001ZM158.257 29.187v2.94h-8.31V15.434h8.146v2.94h-4.225v3.69h3.92v2.94h-3.92v4.184h4.389v-.002ZM54.886 29.26l-.76-1.367a.25.25 0 0 0-.407-.044c-.902 1.034-4.21 4.72-6.014 5.381-3.92 1.437-7.993.015-9.373-5.974l15.772-14.267a.251.251 0 0 0 .045-.319l-.93-1.497a.25.25 0 0 0-.38-.055l-1.398 1.264c-5.001-3.779-7.57-3.77-10.81-.846-.908.82-4.993 5.029-6.317 6.411-1.099 1.147-1.883 2.571-2.404 4.123-1.216-2.054-3.375-3.902-6.623-5.073l8.597-7.778a.257.257 0 0 0 .05-.321l-.925-1.503a.25.25 0 0 0-.383-.05L31.42 8.438C29.328 5.17 24.051.349 15.657.024 12.116-.114 10.086.157 3.53 6.438 1.15 8.722-.569 10.733.176 14.653c.153.81.55 1.736.91 2.41a.251.251 0 0 0 .39.067l1.31-1.186a.251.251 0 0 0 .054-.3c-1.677-3.409-.083-6.386 3.706-8.226 1.735-.844 5.064-1.312 8.551-.736l-6.112 5.527a1.235 1.235 0 0 0-.407.917V30.42c-1.01.314-3.652 1.277-8.36 6.018a.252.252 0 0 0-.04.299l.69 1.245a.25.25 0 0 0 .383.067c1.198-1.05 1.99-1.762 3.381-1.7C7.13 36.46 16.568 40 19.055 40c1.53 0 2.392-.455 3.616-1.435.907-.727 6.654-5.376 7.951-6.525.326-.29.622-.603.887-.938.315 1.472.805 2.815 1.433 3.896 2.077 3.581 9.001 8.324 15.982 1.402 2.17-2.152 5.327-6.096 5.936-6.86a.247.247 0 0 0 .022-.278l.004-.001ZM25.53 13.762l-9.602 8.685V6.84c3.725.794 7.499 2.832 9.602 6.923v-.002Zm1.25 20.08a.243.243 0 0 1-.127.173c-1.787.88-7.7-1.072-10.665-1.955-.996-.296-3.574-1.302-5.552-1.63l9.11-8.24c5.427 1.894 8.309 6.229 7.234 11.653Zm11.721-18.446a.25.25 0 0 1 .256-.21c.848.026 3.987.303 6.36 2.919l-7.19 6.502c-.208-2.483-.055-5.53.574-9.21Z"></path></g><defs><clipPath id="b"><path fill="currentColor" d="M0 0h161v40H0z"></path></clipPath></defs></svg>
        <span class="text-[9px] font-bold uppercase tracking-widest text-white/50">Insights Platform Portal</span>
      </div>
    </div>

    <!-- Reports > General is a full-bleed seamless iframe, no chrome around it -->
    <div id="view-general" class="flex-1 min-h-0 frame-shell relative">
      <div id="frame-loader" class="absolute inset-0 flex items-center justify-center bg-[#faf9f5]">
        <div class="flex flex-col items-center gap-3">
          <div class="w-8 h-8 border-2 border-black/10 border-t-black rounded-full animate-spin"></div>
          <span class="text-[11px] uppercase tracking-widest text-black/40 font-semibold">Loading report&hellip;</span>
        </div>
      </div>
      <iframe
        id="report-iframe"
        class="report-frame"
        src="https://btp-bythenumbers5.netlify.app/"
        title="By The Numbers report"
        onload="document.getElementById('frame-loader').style.display='none'"
        loading="eager"
        referrerpolicy="no-referrer-when-downgrade"
      ></iframe>
    </div>

    <!-- All other views share the standard padded header/content chrome -->
    <div id="view-chrome" class="flex-1 min-h-0 overflow-y-auto hidden">
      <div class="max-w-6xl mx-auto px-10 py-9">
        <div class="text-[11px] font-bold uppercase tracking-widest text-black/40 mb-1" id="crumb">BTP Insights Platform</div>
        <h2 class="text-[34px] font-extrabold uppercase tracking-tight mb-8" id="page-title">Reports</h2>
        <div id="page-body"></div>
      </div>
    </div>

  </main>
</div>

<script>
  const state = { section: 'reports', category: 'general' };

  const reportCards = {
    social: [
      { title: 'Followers', desc: 'Follower growth across all channels.', icon: 'bars' },
      { title: 'Paid Social', desc: 'Paid social spend, reach and conversions.', icon: 'line' },
      { title: 'Organic Social Posts', desc: 'Post-level organic performance.', icon: 'ring' },
    ],
  };

  const measures = [
    { label: 'Followers', value: '312.4K', delta: '4.1K this week' },
    { label: 'Reach', value: '8.4M', delta: '1.1M this week' },
    { label: 'Impressions', value: '22.6M', delta: '3.2M this week' },
    { label: 'Engagements', value: '1.1M', delta: '180K this week' },
    { label: 'Website Visits', value: '48.9K', delta: '6.2K this week' },
    { label: 'Newsletter Only Sign Ups', value: '6,210', delta: '420 this week' },
    { label: 'Product Only Signups', value: '4,880', delta: '360 this week' },
    { label: 'Total Users', value: '27,110', delta: '1,340 this week' },
  ];

  function icon(name) {
    if (name === 'bars') {
      return `<svg viewBox="0 0 100 60" class="w-full h-16"><rect x="6" y="30" width="12" height="24" fill="black"/><rect x="24" y="20" width="12" height="34" fill="black"/><rect x="42" y="10" width="12" height="44" fill="black"/><rect x="60" y="24" width="12" height="30" fill="black"/><rect x="78" y="4" width="12" height="50" fill="black"/></svg>`;
    }
    if (name === 'line') {
      return `<svg viewBox="0 0 100 60" class="w-full h-16"><polyline points="6,44 26,30 46,36 66,14 90,6" fill="none" stroke="black" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="26" cy="30" r="3" fill="black"/><circle cx="46" cy="36" r="3" fill="black"/><circle cx="66" cy="14" r="3" fill="black"/><circle cx="90" cy="6" r="3" fill="black"/></svg>`;
    }
    return `<svg viewBox="0 0 100 60" class="w-full h-16"><circle cx="50" cy="30" r="20" fill="none" stroke="black" stroke-width="9"/></svg>`;
  }

  function renderReportCards(cat) {
    const items = reportCards[cat] || [];
    return `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
      ${items.map(c => `
        <div class="bg-white border border-black/10 rounded-md overflow-hidden hover:shadow-sm transition-shadow cursor-pointer">
          <div class="px-6 pt-6 pb-2">${icon(c.icon)}</div>
          <div class="px-5 py-4 border-t border-black/10">
            <div class="text-[13px] font-extrabold uppercase tracking-wide mb-1">${c.title}</div>
            <div class="text-[13px] text-black/50">${c.desc}</div>
          </div>
        </div>
      `).join('')}
    </div>`;
  }

  function renderMeasures() {
    return `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
      ${measures.map(m => `
        <div class="bg-white border border-black/10 rounded-md px-6 py-5">
          <div class="text-[11px] font-bold uppercase tracking-widest text-black/40 mb-2">${m.label}</div>
          <div class="text-[30px] font-extrabold tracking-tight mb-1">${m.value}</div>
          <div class="text-[12px] text-black/45 flex items-center gap-1">
            <span class="text-black/70">&#9650;</span> ${m.delta}
          </div>
        </div>
      `).join('')}
    </div>`;
  }

  function setSection(section) {
    state.section = section;
    document.getElementById('categories-block').classList.toggle('hidden', section !== 'reports');
    updateToggle();
    if (section === 'measures') {
      showChrome('BTP Insights Platform', 'Key Measures', renderMeasures());
    } else {
      setCategory(state.category);
    }
  }

  function setCategory(cat) {
    state.category = cat;
    document.querySelectorAll('[data-cat]').forEach(el => {
      el.classList.toggle('active', el.dataset.cat === cat);
    });
    if (cat === 'general') {
      document.getElementById('view-general').classList.remove('hidden');
      document.getElementById('view-chrome').classList.add('hidden');
    } else if (cat === 'campaign' || cat === 'product') {
      document.getElementById('view-general').classList.add('hidden');
      const title = cat === 'campaign' ? 'Campaign' : 'Product';
      showChrome('BTP Insights Platform', title, '');
    } else {
      document.getElementById('view-general').classList.add('hidden');
      showChrome('BTP Insights Platform', 'Reports', renderReportCards(cat));
    }
    if (window.innerWidth < 768) closeSidebar();
  }

  function showChrome(crumb, title, bodyHtml) {
    document.getElementById('view-general').classList.add('hidden');
    document.getElementById('view-chrome').classList.remove('hidden');
    document.getElementById('crumb').textContent = crumb;
    document.getElementById('page-title').textContent = title;
    document.getElementById('page-body').innerHTML = bodyHtml;
  }

  function openSidebar() {
    document.getElementById('sidebar').classList.remove('-translate-x-full');
    document.getElementById('sidebar-overlay').classList.remove('hidden');
  }

  function closeSidebar() {
    document.getElementById('sidebar').classList.add('-translate-x-full');
    document.getElementById('sidebar-overlay').classList.add('hidden');
  }

  function updateToggle() {
    const r = document.getElementById('tab-reports');
    const m = document.getElementById('tab-measures');
    r.textContent = 'Reports';
    m.textContent = 'Measures';
    if (state.section === 'reports') {
      r.className = 'seg-btn py-2 uppercase bg-white text-black';
      m.className = 'seg-btn py-2 uppercase bg-black text-white';
    } else {
      r.className = 'seg-btn py-2 uppercase bg-black text-white';
      m.className = 'seg-btn py-2 uppercase bg-white text-black';
    }
  }

  // init
  updateToggle();
  setCategory('general');
</script>

</body>
</html>
